# CI: test build (no publish). Builds RPMs with mock and uploads them as artifacts.

name: CI PR runner

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  RPM_SPEC: v8-stable-el7

jobs:
  testbuild:
    name: Test build (mock ${{ matrix.mock_config }})
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        mock_config:
          - epel-9-x86_64
          - epel-10-x86_64
    container:
      image: quay.io/rockylinux/rockylinux:9
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download rsyslog tarball from GitHub release
        run: |
          set -e
          SPEC=rpmbuild/SPECS/${{ env.RPM_SPEC }}.spec
          RELEASE_JSON=$(curl -fsSL https://api.github.com/repos/rsyslog/rsyslog/releases/latest)
          RELEASE_TAG=$(echo "$RELEASE_JSON" | sed -n 's/.*"tag_name": "\([^"]*\)".*/\1/p' | head -1)
          if [ -z "$RELEASE_TAG" ]; then
            echo "Failed to resolve latest rsyslog GitHub release tag" >&2
            exit 1
          fi
          VERSION=${RELEASE_TAG#v}
          TARBALL=rpmbuild/SOURCES/rsyslog-${VERSION}.tar.gz
          URL="https://github.com/rsyslog/rsyslog/releases/download/${RELEASE_TAG}/rsyslog-${VERSION}.tar.gz"
          echo "Latest GitHub release: ${RELEASE_TAG} (${URL})"
          curl -fsSL -o "$TARBALL" "$URL"
          echo "Downloaded $TARBALL"
          sed -i "s/^Version: .*/Version: ${VERSION}/" "$SPEC"
          echo "Updated spec Version to ${VERSION} for CI mock build"

      - name: Run mock test build
        env:
          MOCK_CONFIG: ${{ matrix.mock_config }}
          RPM_SPEC: ${{ env.RPM_SPEC }}
        run: |
          set -e
          # Heartbeat so the job shows progress (spec %prep can take 30+ min)
          heartbeat() { while true; do sleep 120; echo "[$(date -u +%H:%M:%S)] CI still building (mock chroot/build in progress)..."; done; }
          heartbeat &
          HEARTBEAT_PID=$!
          trap "kill $HEARTBEAT_PID 2>/dev/null || true" EXIT
          echo "== Selected mock target: $MOCK_CONFIG =="
          echo "== Step 1: EPEL and mock =="
          dnf install -y epel-release
          dnf install -y mock dnf-utils cpio binutils
          echo "== Step 2: Mock configs and dirs =="
          # Replace symlink targets with regular files so custom configs do not
          # overwrite shared mock-core-configs aliases like centos-stream+epel-*.
          for cfg in etc-mock/*.cfg; do
            dest="/etc/mock/$(basename "$cfg")"
            rm -f "$dest"
            cp -v "$cfg" "$dest"
          done
          mkdir -p build-result /var/lib/mock
          echo "== Step 3: mock --buildsrpm (can take 20-40 min: chroot init + cmake/qpid-proton/docs) =="
          if ! mock -r "$MOCK_CONFIG" --verbose --buildsrpm \
            --spec "rpmbuild/SPECS/${RPM_SPEC}.spec" \
            --sources rpmbuild/SOURCES \
            --resultdir build-result/srpm; then
            echo "=== mock --buildsrpm FAILED, logs ==="
            tail -300 build-result/srpm/*.log 2>/dev/null || true
            find /var/lib/mock -name "*.log" -exec tail -200 {} \; 2>/dev/null || true
            exit 1
          fi
          SRPM=$(ls build-result/srpm/*.src.rpm)
          echo "== Step 4: mock build from SRPM =="
          if ! mock -r "$MOCK_CONFIG" --verbose "$SRPM" --resultdir build-result/rpms; then
            echo "=== mock build FAILED, logs ==="
            tail -300 build-result/rpms/*.log 2>/dev/null || true
            find /var/lib/mock -name "*.log" -exec tail -200 {} \; 2>/dev/null || true
            exit 1
          fi
          if [ "$MOCK_CONFIG" = "epel-9-x86_64" ]; then
            echo "== Step 5: verify static Kafka linkage =="
            KAFKA_RPM=$(find build-result/rpms -maxdepth 1 -type f -name 'rsyslog-kafka-*.x86_64.rpm' ! -name '*-debuginfo-*' ! -name '*-debugsource-*' -print -quit)
            if [ -z "$KAFKA_RPM" ]; then
              echo "Missing rsyslog-kafka RPM" >&2
              exit 1
            fi
            if ! rpm -qlp "$KAFKA_RPM" | grep -Fx '/usr/share/licenses/rsyslog-kafka/librdkafka-LICENSES.txt'; then
              echo "rsyslog-kafka is missing the bundled librdkafka license notices" >&2
              exit 1
            fi
            if ! rpm -qp --qf '%{LICENSE}\n' "$KAFKA_RPM" | grep -F 'BSD-2-Clause'; then
              echo "rsyslog-kafka is missing its bundled librdkafka license metadata" >&2
              exit 1
            fi
            if rpm -qp --requires "$KAFKA_RPM" | grep -F 'librdkafka.so.1'; then
              echo "rsyslog-kafka unexpectedly has a dynamic librdkafka dependency" >&2
              exit 1
            fi
            mkdir -p build-result/kafka-module-check
            (
              cd build-result/kafka-module-check
              rpm2cpio "../../$KAFKA_RPM" | cpio -idm --quiet
            )
            for module_name in omkafka.so imkafka.so; do
              module=$(find build-result/kafka-module-check -type f -name "$module_name" -print -quit)
              if [ -z "$module" ]; then
                echo "rsyslog-kafka is missing $module_name" >&2
                exit 1
              fi
              if readelf -d "$module" | grep -F 'librdkafka.so.1'; then
                echo "$module unexpectedly links librdkafka dynamically" >&2
                exit 1
              fi
            done
          fi
          echo "== Step 6: collect artifacts =="
          cp -v build-result/srpm/*.rpm build-result/ 2>/dev/null || true
          cp -v build-result/rpms/*.rpm build-result/
          ls -la build-result/

      - name: Upload RPM artifacts (test build only, not published)
        uses: actions/upload-artifact@v4
        with:
          name: rpms-${{ matrix.mock_config }}
          path: build-result/
          if-no-files-found: error

  # Optional: simple validation job that only checks the repo and spec exist (fast)
  validate:
    name: Validate repo
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Check spec and sources
        run: |
          test -f rpmbuild/SPECS/v8-stable-el7.spec
          test -d rpmbuild/SOURCES
          echo "Repo layout OK"
          grep -q "BuildRequires:" rpmbuild/SPECS/v8-stable-el7.spec
          echo "Spec looks valid"
          test -f etc-mock/epel-10-x86_64.cfg
          test -f etc-mock/rhel-10-x86_64.cfg
          grep -q 'epel-10' config.sh
          grep -q 'rhel-10' config.sh
          echo "EL10 mock targets registered"
